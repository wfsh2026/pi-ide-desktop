[package]
name = "pi-ide-desktop"
version = "0.1.0"
description = "A lightweight desktop IDE container for pi.dev Pi Coding Agent"
authors = ["Pi IDE"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.1", features = [] }
tauri-plugin-dialog = "2.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1.19"
tokio = { version = "1.40", features = ["process", "io-util", "sync", "macros"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
shell-words = "1.1"
portable-pty = "0.8"
tauri-plugin-clipboard-manager = "2.3.0"
